name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # Checkout jeeflow-java（测试依赖共享流程 JSON）
      - name: Checkout jeeflow-java
        uses: actions/checkout@v4
        with:
          repository: mldong/jeeflow-java
          path: jeeflow-java

      # Checkout jeeflow-python
      - name: Checkout jeeflow-python
        uses: actions/checkout@v4
        with:
          path: jeeflow-python

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: jeeflow-python/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: jeeflow-python

      - name: Run tests
        run: pytest tests/ -v
        working-directory: jeeflow-python

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install build twine
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pypi-artifacts
          path: dist/*
          retention-days: 7

  verify:
    name: Verify PyPI
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for PyPI indexing
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "⏳ 等待 PyPI 索引同步..."
          sleep 30
          for i in {1..10}; do
            if pip install jeeflow==$VERSION --dry-run 2>&1 | grep -q "Would install"; then
              echo "✅ PyPI jeeflow==$VERSION 已可用"
              exit 0
            fi
            echo "   等待中... ($i/10)"
            sleep 15
          done
          echo "❌ PyPI 验证超时"
          exit 1
